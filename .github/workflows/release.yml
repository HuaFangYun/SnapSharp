name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching NimCap.Screenshot.csproj, for example 1.1.5'
        required: true
        type: string
      mode:
        description: 'Create a draft or publish a stable release'
        required: true
        type: choice
        default: draft
        options:
          - draft
          - publish

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the main branch
        env:
          REQUESTED_REF: ${{ github.ref }}
        run: |
          if [ "$REQUESTED_REF" != 'refs/heads/main' ]; then
            echo 'Run Desktop Release from the main branch.' >&2
            exit 1
          fi
      - name: Check out the requested commit and tags
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the version and require a new release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          version = os.environ['RELEASE_VERSION']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('Use a stable version such as 1.1.5, without the v prefix.')
          project = ET.parse('NimCap.Screenshot.csproj').findtext('./PropertyGroup/Version')
          if version != project:
              raise SystemExit(f'Requested {version}, but the project version is {project}. Commit the version change first.')
          tag = 'v' + version
          tags = subprocess.check_output(['git', 'tag', '--list', tag], text=True).strip()
          if tags:
              raise SystemExit(f'Tag {tag} already exists; releases are never overwritten.')
          pages = json.loads(subprocess.check_output([
              'gh', 'api', '--paginate', '--slurp',
              f'repos/{os.environ["GITHUB_REPOSITORY"]}/releases?per_page=100'
          ], text=True))
          requested = tuple(map(int, version.split('.')))
          for release in [item for page in pages for item in page]:
              if release['tag_name'] == tag:
                  raise SystemExit(f'Release {tag} already exists, including drafts; inspect it before retrying.')
              if not release['draft'] and not release['prerelease']:
                  match = re.fullmatch(r'v([0-9]+)\.([0-9]+)\.([0-9]+)', release['tag_name'])
                  if match and requested <= tuple(map(int, match.groups())):
                      raise SystemExit('The requested version must be newer than existing stable releases.')
          print(f'Validated {tag} at {os.environ["GITHUB_SHA"]}')
          PY

  build:
    needs: validate
    uses: ./.github/workflows/desktop.yml
    with:
      expected_version: ${{ inputs.version }}

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the checked package
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-x64
          path: dist
      - name: Verify the package checksum
        working-directory: dist
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          test -f "nimcap-screenshot-v${RELEASE_VERSION}-win-x64.zip"
          sha256sum --strict --check SHA256SUMS.txt
      - name: Create a draft with both assets, then publish only when requested
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          tag="v${RELEASE_VERSION}"
          gh release create "$tag" \
            "dist/nimcap-screenshot-${tag}-win-x64.zip" \
            dist/SHA256SUMS.txt \
            --target "$RELEASE_COMMIT" \
            --title "NimCap Screenshot ${tag}" \
            --generate-notes \
            --draft
          gh release view "$tag" --json assets --jq '.assets[].name' > assets.txt
          grep -Fx "nimcap-screenshot-${tag}-win-x64.zip" assets.txt
          grep -Fx 'SHA256SUMS.txt' assets.txt
          if [ "$RELEASE_MODE" = 'publish' ]; then
            gh release edit "$tag" --draft=false --latest
          fi
          url="$(gh release view "$tag" --json url --jq '.url')"
          {
            echo "## NimCap Screenshot ${tag}"
            echo "Mode: ${RELEASE_MODE}"
            echo "Commit: ${RELEASE_COMMIT}"
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"
